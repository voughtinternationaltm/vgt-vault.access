<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Vought International</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <section id="boot-screen" class="screen boot-screen" aria-label="Vought International">
      <div class="boot-logo-wrap">
        <div class="logo-mark logo-mark--boot" aria-hidden="true">
          <svg viewBox="0 0 550 393" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path fill="currentColor" d="M23 26H158L258 219L194 343L23 26Z" />
            <path fill="currentColor" d="M195 26H531L347 379H214L364 95H230L195 26Z" />
          </svg>
        </div>

        <div class="wordmark" aria-label="Vought International">
          <div class="wordmark-main">VOUGHT</div>
          <div class="wordmark-sub">INTERNATIONAL</div>
        </div>
      </div>
    </section>

    <section id="security-screen" class="screen security-screen is-hidden" aria-label="Security code">
      <div class="security-watermark" aria-hidden="true">
        <svg viewBox="0 0 550 393" xmlns="http://www.w3.org/2000/svg" focusable="false">
          <path fill="currentColor" d="M23 26H158L258 219L194 343L23 26Z" />
          <path fill="currentColor" d="M195 26H531L347 379H214L364 95H230L195 26Z" />
        </svg>
      </div>

      <form id="security-form" class="security-form" autocomplete="off">
        <label for="security-code">Security Code</label>
        <input
          id="security-code"
          name="security-code"
          type="text"
          inputmode="text"
          spellcheck="false"
          aria-describedby="security-status"
        />
        <div id="security-status" class="security-status" aria-live="polite"></div>
      </form>
    </section>

    <section id="welcome-screen" class="screen welcome-screen is-hidden" aria-label="Welcome">
      <div id="welcome-text" class="welcome-text" aria-live="polite">
        <span id="welcome-copy"></span><span id="welcome-cursor" class="welcome-cursor" aria-hidden="true">_</span>
      </div>
    </section>

    <section id="main-screen" class="screen main-screen is-hidden" aria-label="Vought dashboard">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar navigation" aria-hidden="true">
        <nav class="sidebar-nav">
          <button class="sidebar-link" data-view="home" type="button">Home</button>
          <button class="sidebar-link" data-view="mission" type="button">Mission</button>
          <button class="sidebar-link" data-view="document" type="button">Document</button>
        </nav>

        <button id="logout-button" class="logout-button" type="button">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
            <path d="M9 4H5.75A1.75 1.75 0 0 0 4 5.75v12.5C4 19.216 4.784 20 5.75 20H9" />
            <path d="M14 7l5 5-5 5" />
            <path d="M19 12H9" />
          </svg>
          <span>Logout</span>
        </button>
      </aside>

      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close menu"></button>

      <div class="page-shell">
        <header class="topbar">
          <button
            id="menu-button"
            class="menu-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <div class="header-brand" aria-label="Vought International">
            <div class="logo-mark logo-mark--header" aria-hidden="true">
              <svg viewBox="0 0 550 393" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <path fill="currentColor" d="M23 26H158L258 219L194 343L23 26Z" />
                <path fill="currentColor" d="M195 26H531L347 379H214L364 95H230L195 26Z" />
              </svg>
            </div>
            <div class="header-wordmark">
              <div class="header-wordmark-main">VOUGHT</div>
              <div class="header-wordmark-sub">INTERNATIONAL</div>
            </div>
          </div>

          <nav class="topnav" aria-label="Primary navigation">
            <button class="topnav-link is-active" data-view="home" type="button">Home</button>
            <button class="topnav-link" data-view="mission" type="button">Mission</button>
            <button class="topnav-link" data-view="document" type="button">Document</button>
          </nav>
        </header>

        <div id="page-content" class="page-content"></div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
