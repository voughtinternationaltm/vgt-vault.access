<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Vought International</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="boot-screen" class="screen screen--center">
      <div class="boot-brand" aria-label="Vought International">
        <img class="boot-mark" src="assets/v-mark.svg" alt="">
        <div class="boot-wordmark">
          <span>VOUGHT</span>
          <small>INTERNATIONAL</small>
        </div>
      </div>
    </section>

    <section id="security-screen" class="screen security-screen is-hidden">
      <div class="security-mark" aria-hidden="true">
        <img src="assets/v-mark.svg" alt="">
      </div>
      <form id="security-form" class="security-card" autocomplete="off">
        <label for="security-code">Security Code</label>
        <div class="security-input-wrap">
          <input id="security-code" name="security-code" inputmode="text" spellcheck="false" aria-describedby="security-status">
        </div>
        <div id="security-status" class="security-status" role="status"></div>
      </form>
    </section>

    <section id="welcome-screen" class="screen screen--center is-hidden">
      <div id="welcome-copy" class="welcome-copy" aria-label="Welcome, Fonzi_"></div>
    </section>

    <section id="dashboard" class="dashboard is-hidden">
      <header class="topbar">
        <button id="menu-button" class="icon-button" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <button id="brand-button" class="brand-button" type="button" aria-label="Go to home">
          <img src="assets/v-mark.svg" alt="">
          <span class="brand-wordmark"><strong>VOUGHT</strong><small>INTERNATIONAL</small></span>
        </button>
        <nav class="topnav" aria-label="Primary">
          <button class="nav-link is-active" type="button" data-section="home">Home</button>
          <button class="nav-link" type="button" data-section="mission">Mission</button>
          <button class="nav-link" type="button" data-section="document">Document</button>
        </nav>
      </header>

      <div id="drawer-backdrop" class="drawer-backdrop"></div>
      <aside id="drawer" class="drawer" aria-label="Menu">
        <nav class="drawer-nav">
          <button type="button" data-section="home">Home</button>
          <button type="button" data-section="mission">Mission</button>
          <button type="button" data-section="document">Document</button>
        </nav>
        <button id="logout-button" class="logout-button" type="button">
          <span class="logout-glyph" aria-hidden="true">↪</span>
          <span>Logout</span>
        </button>
      </aside>

      <div class="dashboard-content">
        <section id="section-home" class="content-section is-visible">
          <div class="section-title">Recently</div>
          <div class="empty-state">Open a file to start</div>

          <div class="section-title section-title--documents">Document</div>
          <div class="document-grid">
            <button class="document-card" type="button" data-document="Welcome, Fonzi">
              <span class="document-thumb"></span>
              <span class="document-name">Welcome, Fonzi</span>
            </button>
            <button class="document-card" type="button" data-document="Subject's Personnel Profile">
              <span class="document-thumb"></span>
              <span class="document-name">Subject's Personnel Profile</span>
            </button>
            <button class="document-card" type="button" data-document="My Personnel Profile">
              <span class="document-thumb"></span>
              <span class="document-name">My Personnel Profile</span>
            </button>
          </div>
        </section>

        <section id="section-mission" class="content-section">
          <div class="section-title">Mission</div>
          <div class="mission-space"></div>
        </section>

        <section id="section-document" class="content-section">
          <div class="section-title">Document</div>
          <div class="document-preview-layout">
            <div class="document-preview-card">
              <span class="document-thumb document-thumb--large"></span>
              <div id="selected-document-title" class="document-preview-title is-selected">Welcome, Fonzi</div>
            </div>
            <div class="document-preview-label">Preview</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
